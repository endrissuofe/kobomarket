name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  # Proves the README quick start works on a clean machine:
  # docker compose up must start everything, migrations must run,
  # and the API must reach Postgres.
  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: Wait for the API to be ready (Postgres reachable)
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/health/ready; then echo; exit 0; fi
            sleep 3
          done
          docker compose logs api
          exit 1
      - name: Integration, concurrency and job tests inside the stack
        run: docker compose exec -T -e NODE_ENV=test api npx jest --runInBand tests/integration tests/concurrency tests/jobs
      - name: Ledger audit (money is conserved after the tests)
        run: docker compose exec -T api npm run audit:ledger
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
