# OpenAPI fragment for in-app notifications. Merged into /api-docs by src/docs/openapi.js.
# Notifications are created by the worker from outbox events, never during the
# request that caused them.
paths:
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: Your notifications, newest first (cursor pagination)
      description: >
        Types: ORDER_PLACED, NEW_ORDER, ORDER_CANCELLED, ORDER_SHIPPED,
        FUNDS_RELEASED, DISPUTE_OPENED, DISPUTE_RESOLVED, PAYOUT_SUCCEEDED,
        PAYOUT_FAILED. The response also carries unreadCount.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: unread, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: '{ items: [{ id, type, title, body, data, readAt, createdAt }], nextCursor, unreadCount }'

  /api/v1/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: How many of your notifications are unread
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: '{ unreadCount }' }

  /api/v1/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark one notification read (safe to repeat)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'The notification' }
        '404': { description: 'Not found, or not yours' }

  /api/v1/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all your notifications read
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: '{ updated }: how many were unread' }
