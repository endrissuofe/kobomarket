# OpenAPI fragment for vendor payouts. Merged into /api-docs by src/docs/openapi.js.
paths:
  /api/v1/payouts:
    post:
      tags: [Payouts]
      summary: Request a payout to your bank account (vendor)
      description: >
        The amount leaves your wallet at once into payout clearing; a background
        job sends the transfer within about 30 seconds. On success the payout is
        SUCCESS; on failure the money comes back to your wallet and it is FAILED.
        Only one PENDING payout at a time. Minimum is the payout_min_kobo setting
        (default 100000 kobo = NGN 1,000). With the mock provider, a bank account
        number ending in 0000 always fails (for demos and tests).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountKobo]
              additionalProperties: false
              properties:
                amountKobo: { type: integer, minimum: 1, example: 300000 }
      responses:
        '201': { description: 'The PENDING payout (account number masked)' }
        '400': { description: 'IDEMPOTENCY_KEY_REQUIRED' }
        '403': { description: 'Not a vendor, VENDOR_NOT_APPROVED or ACCOUNT_FROZEN' }
        '409': { description: 'PAYOUT_PENDING, WALLET_NOT_READY or IDEMPOTENCY_KEY_REUSED' }
        '422': { description: 'BELOW_PAYOUT_MINIMUM, INSUFFICIENT_FUNDS or VALIDATION_ERROR' }
    get:
      tags: [Payouts]
      summary: Your payouts, newest first (vendor)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          {
            description: '{ items: [{ id, amountKobo, status, bank, providerRef, failureReason, createdAt, processedAt }], nextCursor }',
          }
